<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/menu.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolBox</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html,
      body {
        background: #000000;
      }
      #root {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #f2f2f2;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root"><div class="boot-spinner"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
